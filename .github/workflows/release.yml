name: Release

# How releases happen (see README → "Releasing"):
#   1. PRs are merged into main with Conventional Commit titles (feat:, fix:, …).
#   2. release-please keeps a "chore(main): release x.y.z" PR open with the changelog and version bump.
#   3. Merging that PR tags vX.Y.Z and publishes the GitHub release. The jobs below then
#      build the Mac and Windows apps, attach them, and point the Homebrew cask at the new version.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  macos:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - id: pkg
        run: |
          out=$(scripts/package-mac.sh | tail -2)
          echo "zip=$(echo "$out" | head -1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"
      - run: node scripts/build-release-config.mjs
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" --clobber \
            "${{ steps.pkg.outputs.zip }}" release/assessit-config.json release/default-policy.json

  windows:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" --clobber src-tauri/target/release/bundle/nsis/*.exe

  homebrew:
    # Homebrew users get the update on their next `brew upgrade` (brew refreshes taps automatically).
    needs: [release-please, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the cask at this release
        run: |
          version="${{ needs.release-please.outputs.version }}"
          sed -i -E "s/^  version \".*\"/  version \"${version}\"/" Casks/assessit.rb
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"${{ needs.macos.outputs.sha256 }}\"/" Casks/assessit.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Homebrew cask to ${version}" && git push || echo "Cask already up to date"
