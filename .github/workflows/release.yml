name: Release

# Releases are manual: Actions → Release → Run workflow, pick patch/minor/major (or type a version).
#
#   plan      works out the version from package.json and checks the tag name is free
#   macos     tests and builds the universal Mac zip    ┐ in parallel, from the same commit.
#   windows   builds the Windows installer              │ Nothing is public yet.
#   linux     builds the .deb and AppImage              ┘
#   publish   waits for approval if the "release" environment requires it, signs the files the in-app
#             updater downloads (the only job that sees the signing key), then creates the tag and
#             the GitHub release with every file attached, and merges the version + Homebrew cask
#             commit into main through a pull request (main only accepts changes through PRs).
#
# If anything fails before publish, nothing has changed anywhere: fix it and run the workflow again.
# The repo uses GitHub's immutable releases, so a published release (and its tag name) is final.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version (e.g. 1.0.0). Leave blank to use the bump above.
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          version=$(node -e '
            const cur = require("./package.json").version.split(".").map(Number);
            const exact = process.env.EXACT.trim().replace(/^v/, "");
            let next;
            if (exact) {
              if (!/^\d+\.\d+\.\d+$/.test(exact)) { console.error(`Not a version: ${exact}`); process.exit(1); }
              next = exact.split(".").map(Number);
              const newer = next[0] - cur[0] || next[1] - cur[1] || next[2] - cur[2];
              if (newer <= 0) { console.error(`${exact} is not newer than the current ${cur.join(".")}`); process.exit(1); }
            } else {
              const i = { major: 0, minor: 1, patch: 2 }[process.env.BUMP];
              next = cur.map((n, j) => (j < i ? n : j === i ? n + 1 : 0));
            }
            console.log(next.join("."));
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "### Releasing v$version from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the tag name is free
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
          SHA: ${{ steps.v.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Pick a newer version."; exit 1
          fi
          # GitHub never frees the tag names of deleted immutable releases, and git can't see them.
          # Creating (and immediately deleting) the tag finds out now instead of after the builds.
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null; then
            echo "::error::GitHub won't allow the tag $TAG (it probably belonged to a deleted release). Pick a newer version."; exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"

  macos:
    needs: plan
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: node scripts/set-version.mjs ${{ needs.plan.outputs.version }}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - id: pkg
        run: |
          out=$(scripts/package-mac.sh | tail -2)
          echo "sha256=$(echo "$out" | tail -1)" >> "$GITHUB_OUTPUT"
      - run: node scripts/build-release-config.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: |
            release/*.zip
            release/*.tar.gz
            release/assessit-config.json
            release/default-policy.json
          if-no-files-found: error

  windows:
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/set-version.mjs ${{ needs.plan.outputs.version }}
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    needs: plan
    # Oldest supported runner, so the AppImage's glibc works on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - run: node scripts/set-version.mjs ${{ needs.plan.outputs.version }}
      - run: npm ci
      - run: npx tauri build --bundles deb,appimage
      # Flat folder, so the artifact has no deb/ or appimage/ subfolders and publish's `out/*` only sees files.
      - run: mkdir linux-out && cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage linux-out/
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: linux-out/*
          if-no-files-found: error

  publish:
    needs: [plan, macos, windows, linux]
    runs-on: ubuntu-latest
    # To approve each release by hand: Settings → Environments → release → Required reviewers.
    # The builds can be downloaded from this run's summary while it waits.
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: no dependency's install script runs in the job that holds the signing key.
      - run: npm ci --ignore-scripts
      # Signs every file the in-app updater can download, then builds latest.json from them. The key
      # exists only in this step's environment. Output of the signing tool is never printed: a failure
      # says which file failed and nothing else, so the public log can't leak key material.
      # Nothing is public yet, so a failure here changes nothing: fix the secrets and run again.
      - name: Sign update files
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.plan.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +x
          # An earlier attempt already published: the next step only finishes updating main.
          if [ "$(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null || true)" = "false" ]; then
            echo "v$V is already published; nothing to sign."; exit 0
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty or missing. Add it under Settings → Environments → release → Environment secrets (README: Update signing)."
            exit 1
          fi
          log="$RUNNER_TEMP/sign.log"
          for pattern in '*-macos-universal.app.tar.gz' '*-setup.exe' '*.AppImage' '*.deb'; do
            files=$(find out -maxdepth 1 -name "$pattern")
            if [ -z "$files" ]; then
              echo "::error::No file matching $pattern to sign. Did a build job change its output?"; exit 1
            fi
            for f in $files; do
              if ! npx tauri signer sign --app-version "$V" "$f" >"$log" 2>&1; then
                rm -f "$log"
                echo "::error::Signing $(basename "$f") failed. Details are withheld so the log can't expose the key. To see why, run \`npx tauri signer sign\` locally with the same key and password. Usual causes: the secret holds only part of the key file, or the password secret is wrong."
                exit 1
              fi
              rm -f "$log"
            done
          done
          node scripts/updater-manifest.mjs out "$V"
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
          CASK_SHA: ${{ needs.macos.outputs.sha256 }}
        run: |
          branch="release-v$V"

          # Merges the version + cask commit into main. main only accepts changes through pull requests.
          merge_into_main() {
            pr=$(gh pr list --head "$branch" --base main --state open --json url -q '.[0].url')
            [ -n "$pr" ] || pr=$(gh pr create --base main --head "$branch" --title "chore(release): v$V" \
              --body "Version bump and Homebrew cask for [v$V](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$V). Opened by the Release workflow.")
            if gh pr merge "$pr" --squash; then
              git push origin --delete "$branch"
              echo "Merged $pr" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::v$V is published, but $pr couldn't be merged automatically (for example, it needs an approval). Merge it to update main and the Homebrew cask."
              echo "**Merge $pr** to update main and the Homebrew cask." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          }

          # Safe to re-run: if an earlier attempt already published, only finish updating main.
          state=$(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null || true)
          if [ "$state" = "false" ]; then
            echo "v$V is already published by an earlier attempt."
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then merge_into_main; fi
            exit 0
          fi
          # A draft means an earlier attempt stopped mid-upload. Drafts can be deleted; start over.
          [ "$state" = "true" ] && gh release delete "v$V" --yes

          ls -l out
          node scripts/set-version.mjs "$V"
          sed -i -E "s/^  version \".*\"/  version \"$V\"/; s/^  sha256 \".*\"/  sha256 \"$CASK_SHA\"/" Casks/assessit.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$V"
          commit=$(git rev-parse HEAD)

          # The release must contain exactly what was built and tested.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$SHA" ]; then
            echo "::error::main changed while this release was building. Run the Release workflow again."; exit 1
          fi

          # The release needs its commit on GitHub first; park it on a temporary branch
          # (replacing any left by an attempt that stopped before publishing).
          git push --force origin "HEAD:refs/heads/$branch"
          # Creates a draft, uploads every file, then publishes: nothing is public until it's complete.
          if ! gh release create "v$V" out/* --target "$commit" --title "AssessIT $V" --generate-notes --latest; then
            git push origin --delete "$branch"; exit 1
          fi
          echo "### Published [v$V](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$V)" >> "$GITHUB_STEP_SUMMARY"
          merge_into_main
