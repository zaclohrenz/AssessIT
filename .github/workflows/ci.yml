name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      # Unit tests, the 45 golden scoring cases from the reference spreadsheet,
      # citation checks on the default policy, and SCORING.md drift.
      - run: npm test
      - run: npx vite build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows
    # Catches Windows-only Rust (registry lookups, process flags) before release day.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: New-Item -ItemType Directory -Force dist; Set-Content dist/index.html "<!doctype html>"
      - run: cargo check --manifest-path src-tauri/Cargo.toml
